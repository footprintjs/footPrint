name: Report main failures

# Consumers is a PR and manual-dispatch audit. CI is the main-push gate.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}

jobs:
  reconcile:
    if: >-
      github.repository == 'footprintjs/footPrint' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      contains(fromJSON('["failure", "startup_failure", "timed_out", "success"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: footprint-main-health-issues
      cancel-in-progress: false
    permissions:
      actions: read
      issues: write
    steps:
      # Do not check out source, use caches, or download triggering-run artifacts
      # in this issue-writing job. Event metadata is used only as data.
      - name: Reconcile the workflow's issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const repository = context.repo;
            const { repository: eventRepository, workflow_run: observed } = context.payload;
            const workflow = 'ci.yml';
            const isSameMainPush = run =>
              run.event === 'push' && run.head_branch === 'main' &&
              run.head_repository?.id === eventRepository.id;
            const conclusions = ['failure', 'startup_failure', 'timed_out', 'success'];
            if (observed.name !== 'CI' || !isSameMainPush(observed) || !conclusions.includes(observed.conclusion)) return;

            // Queued events can coalesce. Reconcile from the latest eligible
            // result every time, even when this event arrived out of order.
            const runs = await Promise.all(conclusions.map(async conclusion => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...repository, workflow_id: workflow, branch: 'main', event: 'push',
                status: conclusion, per_page: 1,
              });
              return data.workflow_runs[0];
            }));
            const latest = runs.filter(run => run && isSameMainPush(run))
              .sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt)[0];
            if (!latest) return;

            const label = 'main-red';
            const key = `<!-- footprint-main-red:${workflow} -->`;
            const reporter = 'github-actions[bot]';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repository, labels: label, state: 'open', per_page: 100,
            });
            const issue = issues.find(candidate => !candidate.pull_request &&
              candidate.user?.login === reporter && candidate.body?.startsWith(key));

            if (latest.conclusion === 'success') {
              if (issue) {
                await github.rest.issues.update({
                  ...repository, issue_number: issue.number, state: 'closed', state_reason: 'completed',
                });
              }
              return;
            }

            const marker = `<!-- footprint-main-red-attempt:${latest.id}:${latest.run_attempt} -->`;
            const runUrl = `${context.serverUrl}/${repository.owner}/${repository.repo}/actions/runs/${latest.id}/attempts/${latest.run_attempt}`;
            const title = `${observed.name} is failing on main`;
            const body = `[${observed.name} run ${latest.run_number}, attempt ${latest.run_attempt}](${runUrl}) ended with **${latest.conclusion}** on commit \`${latest.head_sha}\`.\n\n${marker}`;
            if (issue) {
              if (issue.body.includes(marker)) return;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...repository, issue_number: issue.number, per_page: 100,
              });
              if (comments.some(comment => comment.user?.login === reporter && comment.body?.includes(marker))) return;
              await github.rest.issues.createComment({ ...repository, issue_number: issue.number, body });
              return;
            }

            try {
              await github.rest.issues.getLabel({ ...repository, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...repository, name: label, color: 'B60205', description: 'A required workflow is failing on main',
              });
            }
            await github.rest.issues.create({ ...repository, title, labels: [label], body: `${key}\n\n${body}` });
