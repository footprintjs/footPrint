name: Consumers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swapped-parents:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse the synthetic swapped pair before any package code
        run: |
          set -eu
          fixture="$RUNNER_TEMP/admission-fixture"
          mkdir "$fixture"
          cd "$fixture"
          git init --quiet
          git config user.name 'CI test fixture'
          git config user.email 'fixture@example.invalid'
          printf '{"name":"footprintjs","version":"1.0.0"}\n' > package.json
          git add package.json
          git commit --quiet -m common
          common="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          base="$(git commit-tree "$tree" -p "$common" -m base)"
          head="$(git commit-tree "$tree" -p "$common" -m head)"
          swapped="$(git commit-tree "$tree" -p "$head" -p "$base" -m swapped)"
          git checkout --quiet --detach "$swapped"
          event="$RUNNER_TEMP/swapped.json"
          printf '{"action":"opened","number":42,"pull_request":{"base":{"ref":"main","repo":{"id":%s},"sha":"%s"},"head":{"sha":"%s"}}}\n' "$GITHUB_REPOSITORY_ID" "$base" "$head" > "$event"
          printf 'Expected ordered pair: %s %s\n' "$base" "$head"
          env GITHUB_EVENT_NAME=pull_request GITHUB_REF=refs/pull/42/merge GITHUB_SHA="$swapped" GITHUB_EVENT_PATH="$event" node "$GITHUB_WORKSPACE/scripts/subflow-protocol/bind-source.mjs"
  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - run: printf 'Harmless candidate test marker\n' > marker.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: only-candidate-marker
          path: marker.txt
          retention-days: 1
          if-no-files-found: error
  mismatched-artifact:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm the requested ID differs from the only same-run artifact
        env:
          ACTUAL_ID: ${{ needs.producer.outputs.id }}
        run: |
          test -n "$ACTUAL_ID"
          test "$ACTUAL_ID" != 1
          printf 'Producer artifact %s; deliberately different requested ID 1\n' "$ACTUAL_ID"
      - name: Refuse a mismatched same-run artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 1
          path: ${{ runner.temp }}/candidate-zip
          skip-decompress: true
