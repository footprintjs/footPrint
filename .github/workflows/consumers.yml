name: Consumers

# THE CONSUMER AUDIT: every family consumer's own checks, run against this footprintjs candidate.
# hcifootprint 2.6.0 broke on every fresh install after footprintjs 9.36 removed internals it
# imported, and nobody noticed for weeks. scripts/release.sh refuses to tag unless this workflow
# is green for HEAD. The consumers are listed in scripts/family.json; the rule lives in
# scripts/audit-consumers.mjs; docs/guides/consumer-audit.md says how to read a run.
#
# A consumer can block only when its own ranges (its manifest, its registry pins) accept the BASE
# branch's version, read below from the base commit. What that delivers: an ordinary edit of the
# version no longer decides who may block. It does not put the gate out of the pull request's reach:
# on `pull_request` the pull request's own copy of this workflow and of the audit's scripts runs, as
# it always did.
# Such a consumer red only on the candidate fails its job: BLOCKING. One red on the published
# footprintjs too is its own failure: a warning, and its job stays green. A consumer whose ranges
# refuse the base has not opted in to that line: it reports only (`opt-in needed`, `needs migration`)
# and never fails its job. When a declaration in a consumer's install graph refuses the candidate's
# version, the candidate's code is installed relabelled as a version it accepts.
# docs/guides/consumer-audit.md has the rule and its table.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A read-only token and no secrets. No cache is restored or saved, and every action is pinned to
# a full commit SHA (a moved tag would otherwise run here).
permissions:
  contents: read

concurrency:
  group: consumers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      consumers: ${{ steps.list.outputs.consumers }}
      base_version: ${{ steps.base.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version of the branch this pull request merges into decides which consumers may block it.
      # Read from the base commit and checked to be a plain version before it becomes a step output.
      # It runs FIRST, before `npm ci` and the build run code the pull request controls (a `prepare`
      # script could otherwise put another `git` or `node` on PATH). The runner image's own node.
      # A manual run passes nothing: the candidate's own version.
      - name: Read the base branch's version
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"
          version="$(git show "$BASE_SHA:package.json" | node -e "const v = JSON.parse(require('fs').readFileSync(0, 'utf8')).version; if (typeof v !== 'string' || !/^[0-9A-Za-z.+-]{1,64}$/.test(v)) process.exit(1); process.stdout.write(v);")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      # Use npm 11 with the committed development lock, as ci.yml does.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Verify one installed Foottrace
        run: |
          node --input-type=module -e "import { inspectFoottrace } from './scripts/foottrace-install.mjs'; const result = inspectFoottrace(process.cwd(), { required: true }); console.log(result.message); process.exit(result.ok ? 0 : 1);"
      - run: npm run build

      - name: Pack the candidate
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          npm pack --pack-destination "$RUNNER_TEMP/candidate"
          mv "$RUNNER_TEMP"/candidate/footprintjs-*.tgz "$RUNNER_TEMP/candidate/footprintjs-candidate.tgz"

      - name: List the consumers (scripts/family.json)
        id: list
        run: echo "consumers=$(node -p "JSON.stringify(require('./scripts/family.json').family.filter((f) => f.checks).map((f) => f.package))")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate/footprintjs-candidate.tgz
          retention-days: 3

  consumer:
    needs: pack
    name: ${{ matrix.consumer }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJSON(needs.pack.outputs.consumers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22: the version the consumers' own CI runs.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm install -g npm@11

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate

      # The audit resolves public declarations with TypeScript. Its own declared
      # devDependencies belong to this checkout, not to whichever consumer is tested.
      # No build or lifecycle hooks are needed to run the source-level audit.
      - name: Install audit dependencies
        run: npm ci --ignore-scripts

      # setup-node turns tsc and eslint output into annotations. Here that output is a consumer's,
      # and the run's annotations should be the audit's verdicts; the output stays in the log.
      - name: Keep the consumers' compiler output out of the run's annotations
        run: |
          echo "::remove-matcher owner=tsc::"
          echo "::remove-matcher owner=eslint-stylish::"
          echo "::remove-matcher owner=eslint-compact::"

      - name: Audit ${{ matrix.consumer }}
        env:
          CONSUMER: ${{ matrix.consumer }}
          BASE_VERSION: ${{ needs.pack.outputs.base_version }}
        run: node scripts/audit-consumers.mjs --only "$CONSUMER" --candidate "$RUNNER_TEMP/candidate/footprintjs-candidate.tgz" --apt ${BASE_VERSION:+--base-version "$BASE_VERSION"}
