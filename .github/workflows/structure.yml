name: Advisory structure report
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  structure-report:
    uses: footprintjs/ci/.github/workflows/structure-report.yml@726ed160f971bdb173d5274566a01d6514809c33
    with:
      tool_sha: 726ed160f971bdb173d5274566a01d6514809c33
      source_sha: ${{ github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
