name: Advisory structure report
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  structure-report:
    uses: footprintjs/ci/.github/workflows/structure-report.yml@7f2bfc504184be3b9946d17933323d1bf1dd6932
    with:
      tool_sha: 7f2bfc504184be3b9946d17933323d1bf1dd6932
      source_sha: ${{ github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
