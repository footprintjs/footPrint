name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Temporary bootstrap: retain npm's normal registry lock, then remove this job.
  read-law-stable-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install -g npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve the published stable read-law package normally
        run: npm install --package-lock-only --strict-peer-deps --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify the generated registry entry
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json'));
          assert.equal(lock.packages[''].dependencies.foottrace, '^1.11.1');
          const entry = lock.packages['node_modules/foottrace'];
          assert.equal(entry.version, '1.11.1');
          assert.equal(entry.resolved, 'https://registry.npmjs.org/foottrace/-/foottrace-1.11.1.tgz');
          assert.match(entry.integrity, /^sha512-/u);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fp124-normal-stable-registry-lock
          path: package-lock.json
          if-no-files-found: error

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Use npm 11 with the committed development lock and publishing toolchain.
      - run: npm install -g npm@11

      # Use the reviewed development tree, including the exact Foottrace used by record-byte checks.
      - run: npm ci
      - name: Verify one installed Foottrace
        run: |
          node --input-type=module -e "import { inspectFoottrace } from './scripts/foottrace-install.mjs'; const result = inspectFoottrace(process.cwd(), { required: true }); console.log(result.message); process.exit(result.ok ? 0 : 1);"
      - run: npm run build
      - name: Foottrace consumer contract
        run: npm run test:contract:foottrace
      - run: npm test
      # Examples are integration tests; doc code snippets must reference the real API.
      - run: npm run test:examples
      - run: npm run check:doc-snippets
      # Packaging-correctness gate: dual CJS/ESM types resolve in every consumer mode.
      # attw exits non-zero on a types masquerade / internal resolution error.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Readiness reports the trailing co-change window from complete history.
          fetch-depth: 0

      - name: Check workflow syntax and expression contexts
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          trap 'rm -rf "$tool_dir"' EXIT
          tool_archive="$tool_dir/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$tool_archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$tool_archive" | sha256sum --check --strict -
          tar -xzf "$tool_archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -shellcheck='' -pyflakes='' \
            .github/workflows/publish.yml .github/workflows/docs.yml .github/workflows/ci.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Use npm 11 with the committed development lock and publishing toolchain.
      - run: npm install -g npm@11

      # Use the same committed development tree as the runtime matrix.
      - run: npm ci
      - name: Verify one installed Foottrace
        run: |
          node --input-type=module -e "import { inspectFoottrace } from './scripts/foottrace-install.mjs'; const result = inspectFoottrace(process.cwd(), { required: true }); console.log(result.message); process.exit(result.ok ? 0 : 1);"
      - run: npm run lint
      - run: npm run format
      # The fence (layering table in scripts/layering.config.cjs): value-level cycles + upward edges.
      - run: npm run check:layering
      - run: npm run check:record-tests
      # E3's package boundary is local. Consumer migration remains a separate audit.
      - run: npm run check:trace-ready
