name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foottrace-candidate:
    # E3 only: the dependency has not been published. One immutable source pin,
    # one packed artifact shared by every engine check; no registry fallback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@11
      - run: node scripts/foottrace-candidate.mjs pack "$RUNNER_TEMP/foottrace"
      - uses: actions/upload-artifact@v4
        with:
          name: foottrace-candidate
          path: ${{ runner.temp }}/foottrace/foottrace-candidate.tgz*
          retention-days: 3

  test:
    needs: foottrace-candidate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Pin the resolver. With no committed lockfile every job resolves fresh, so a
      # dependency published upstream can break resolution without this repo changing:
      # npm 10.9.x's arborist crashes ("Cannot read properties of null (reading
      # 'edgesOut')") in #loadPeerSet on vitest 4.x's optional peer set. npm 11 resolves
      # the same package.json cleanly, and the publish job has always pinned it.
      - run: npm install -g npm@11

      # No committed lockfile (library policy: vitest 4.x → rolldown's per-OS native
      # binding, npm #4828). `cache: npm` dropped (it keys off the absent lockfile).
      - uses: actions/download-artifact@v4
        with:
          name: foottrace-candidate
          path: ${{ runner.temp }}/foottrace
      - run: node scripts/foottrace-candidate.mjs install "$RUNNER_TEMP/foottrace/foottrace-candidate.tgz"
      - run: npm run build
      - run: npm test
      # Examples are integration tests; doc code snippets must reference the real API.
      - run: npm run test:examples
      - run: npm run check:doc-snippets
      # Packaging-correctness gate: dual CJS/ESM types resolve in every consumer mode.
      # attw exits non-zero on a types masquerade / internal resolution error.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

  lint:
    needs: foottrace-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Readiness reports the trailing co-change window from complete history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pin the resolver. With no committed lockfile every job resolves fresh, so a
      # dependency published upstream can break resolution without this repo changing:
      # npm 10.9.x's arborist crashes ("Cannot read properties of null (reading
      # 'edgesOut')") in #loadPeerSet on vitest 4.x's optional peer set. npm 11 resolves
      # the same package.json cleanly, and the publish job has always pinned it.
      - run: npm install -g npm@11

      # No committed lockfile (library policy); cache:npm dropped (it requires one).
      - uses: actions/download-artifact@v4
        with:
          name: foottrace-candidate
          path: ${{ runner.temp }}/foottrace
      - run: node scripts/foottrace-candidate.mjs install "$RUNNER_TEMP/foottrace/foottrace-candidate.tgz"
      - run: npm run lint
      - run: npm run format
      # The fence (layering table in scripts/layering.config.cjs): value-level cycles + upward edges.
      - run: npm run check:layering
      - run: npm run check:record-tests
      # E3's package boundary is local. Consumer migration remains a separate audit.
      - run: npm run check:trace-ready
