name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Use npm 11 with the committed development lock and publishing toolchain.
      - run: npm install -g npm@11

      # Use the reviewed development tree, including the exact Foottrace used by record-byte checks.
      - run: npm ci
      - name: Verify one installed Foottrace
        run: |
          node --input-type=module -e "import { inspectFoottrace } from './scripts/foottrace-install.mjs'; const result = inspectFoottrace(process.cwd(), { required: true }); console.log(result.message); process.exit(result.ok ? 0 : 1);"
      - run: npm run build
      - run: npm test
      # Examples are integration tests; doc code snippets must reference the real API.
      - run: npm run test:examples
      - run: npm run check:doc-snippets
      # Packaging-correctness gate: dual CJS/ESM types resolve in every consumer mode.
      # attw exits non-zero on a types masquerade / internal resolution error.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Readiness reports the trailing co-change window from complete history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Use npm 11 with the committed development lock and publishing toolchain.
      - run: npm install -g npm@11

      # Use the same committed development tree as the runtime matrix.
      - run: npm ci
      - name: Verify one installed Foottrace
        run: |
          node --input-type=module -e "import { inspectFoottrace } from './scripts/foottrace-install.mjs'; const result = inspectFoottrace(process.cwd(), { required: true }); console.log(result.message); process.exit(result.ok ? 0 : 1);"
      - run: npm run lint
      - run: npm run format
      # The fence (layering table in scripts/layering.config.cjs): value-level cycles + upward edges.
      - run: npm run check:layering
      - run: npm run check:record-tests
      # E3's package boundary is local. Consumer migration remains a separate audit.
      - run: npm run check:trace-ready
