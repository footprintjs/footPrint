name: Publish to npm

on:
  release:
    types: [published]

# Least privilege: NO id-token at the top level. OIDC publish power is granted ONLY to the
# `publish` job, which consumes a PRE-PACKED tarball and does ZERO dependency resolution —
# so the locked `npm ci` (in `build`) never shares a runtime with the registry
# token or `npm publish --provenance`.
permissions:
  contents: read

jobs:
  # Nothing releases while an open issue or pull request carries the label `hold-release`
  # (https://github.com/footprintjs/ci/blob/b14f372d4c26e9f3059068b250544aa320b834aa/docs/HOLD.md). This job is the early signal:
  # a held release stops before it spends minutes on install, build and tests. It is NOT what
  # holds on "Re-run failed jobs" (a green job is not run again); the step in `publish` is.
  # The pin is footprintjs/ci commit b14f372d4c26e9f3059068b250544aa320b834aa. Both `uses:` and `tool_sha` must name
  # the same reviewed full commit, and must move together with the action step in `publish`.
  hold:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: footprintjs/ci/.github/workflows/hold.yml@b14f372d4c26e9f3059068b250544aa320b834aa
    with:
      tool_sha: b14f372d4c26e9f3059068b250544aa320b834aa
      mode: publish

  build:
    needs: hold
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      source: ${{ steps.release.outputs.source }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # Use npm 11 with the committed development lock and publishing toolchain.
      - run: npm install -g npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Admit the release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release/run.sh admit

      # Install the committed development tree. This job has NO publish power.
      - run: npm ci
      # Build before test: the built-package guards run from test:examples, which needs dist/.
      - run: npm run build
      - run: npm test
      - run: npm run test:examples

      # Packaging-correctness gate — block a publish that would ship broken/masquerading types.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

      # Pack here, where node_modules + .git exist, so the `prepare` (husky) lifecycle runs
      # cleanly. The publish job consumes this exact tarball — it does NOT re-pack (which
      # would re-trigger lifecycle scripts in a node_modules-less runner).
      - name: Pack the publishable tarball
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash scripts/publish-release/run.sh stage
          npm pack
          mv ./*.tgz package.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: package.tgz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: read # the hold step lists labelled issues and pull requests
      pull-requests: read
    env:
      TRUSTED_SOURCE: ${{ github.workspace }}/trusted-source
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The reviewed publishing toolchain only; no package dependencies are installed here.
      - run: npm install -g npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org

      # Source and helper are pinned independently of anything produced by build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          persist-credentials: false
          sparse-checkout: |
            scripts/publish-release
            package.json
          sparse-checkout-cone-mode: false

      - name: Admit the publication source
        run: bash "$TRUSTED_SOURCE/scripts/publish-release/run.sh" admit

      # A fixed download implementation isolates all untrusted artifact bytes from the helper.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/fp-release-intake

      # The hold check, directly before the publish step. It runs again whenever this job runs
      # again, which the `hold` job cannot promise. No `if:`, no `continue-on-error`, no `token:`
      # input: a check that cannot run fails this job, and the publish below does not run.
      # Pinned to footprintjs/ci commit b14f372d4c26e9f3059068b250544aa320b834aa, the same commit as the `hold` job above.
      - uses: footprintjs/ci/.github/actions/hold@b14f372d4c26e9f3059068b250544aa320b834aa

      # Inspect canonical bytes and the complete source-bound manifest; publish those same bytes.
      - name: Publish to npm
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/fp-release-intake
          PUBLISH_DIRECTORY: ${{ runner.temp }}/fp-release-publish
        run: bash "$TRUSTED_SOURCE/scripts/publish-release/run.sh" publish
