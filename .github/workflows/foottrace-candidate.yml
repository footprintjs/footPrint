name: Foottrace final candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/foottrace-candidate.yml'
      - 'scripts/foottrace-candidate/**'

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install -g npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          persist-credentials: false
      - name: Test the sweep guards
        run: node --test harness/scripts/foottrace-candidate/*.test.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: footprintjs/foottrace
          ref: 59856191be7514d04438826460ebeb165c137220
          path: candidate
          persist-credentials: false
      - name: Build and pack the unmodified App proposal
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(npm --version)" = '11.19.0'
          npm ci
          npm run build
          npm run check:package
          mkdir "$RUNNER_TEMP/foottrace-candidate"
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/foottrace-candidate/pack.json"
          node ../harness/scripts/foottrace-candidate/pack.mjs "$PWD" "$RUNNER_TEMP/foottrace-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foottrace-candidate
          path: ${{ runner.temp }}/foottrace-candidate
          if-no-files-found: error
          retention-days: 30

  sweep:
    needs: pack
    name: ${{ matrix.consumer }} Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22.16.0, 24.21.0]
        consumer: [footprintjs, agentfootprint, lens]
        include:
          - consumer: footprintjs
            repository: footprintjs/footPrint
            head: ec204c7269e08df0d9e7e9fc4d9df327fe9a8af1
          - consumer: agentfootprint
            repository: footprintjs/agentfootprint
            head: 2e629b891542f5f601dbb0051abe84d0d253a6c5
          - consumer: lens
            repository: footprintjs/agentfootprint-lens
            head: 1c3c5f1ae2f594cc38a621a535ffdb40f020d79c
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install -g npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.head }}
          path: consumer
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: foottrace-candidate
          path: ${{ runner.temp }}/foottrace-candidate
      - name: Run the exact candidate through the whole suite and contract
        env:
          CONSUMER: ${{ matrix.consumer }}
        run: |
          set -euo pipefail
          mv consumer "$RUNNER_TEMP/foottrace-consumer"
          node harness/scripts/foottrace-candidate/run.mjs \
            "$CONSUMER" "$RUNNER_TEMP/foottrace-consumer" \
            "$RUNNER_TEMP/foottrace-candidate" "$RUNNER_TEMP/foottrace-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: foottrace-${{ matrix.consumer }}-${{ matrix.node }}
          path: ${{ runner.temp }}/foottrace-evidence/evidence
          if-no-files-found: error
          retention-days: 30
